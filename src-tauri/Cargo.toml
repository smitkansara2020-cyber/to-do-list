[package]
name = "pinboard"
version = "1.0.0"
description = "Pinboard - Daily Ramp & Focus"
authors = ["Smit Kansara"]
edition = "2021"

[lib]
name = "pinboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
